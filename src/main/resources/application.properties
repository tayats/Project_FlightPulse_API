# 1. H2 Database Connection (In-Memory database named flightdb)
spring.datasource.url=jdbc:h2:mem:flightdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# 3. Hibernate: Auto-create and update database tables based on your Java classes!
spring.jpa.hibernate.ddl-auto=update

# 4. Print all generated SQL statements in the IntelliJ console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true